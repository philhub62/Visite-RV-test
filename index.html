let fields=items.map(item=>{let k=title+' / '+item;let arr=getObs(section,k);if(!arr.length){arr.push({id:uid(),note:'',photos:[]});schedule()}return `<div class="sub-field"><label class="sub-title" ${items.length===1&&item===title?'style="display:none"':''}>${E(item)}</label><textarea rows="1" data-admin-item="${E(k)}" placeholder="Saisir…">${E(arr[0].note)}</textarea></div>`}).join('');
let obs=section===2&&title==='Groupe inventaire'?[]:adminObs(title);return `<div class="relex-group" data-admin-group="${gi}"><h3>${E(title)}</h3>${fields}${section===2&&title==='Groupe inventaire'?'':`<div class="general-area"><div id="admin-obs-${gi}">${obs.map((o,j)=>obHTML(o,j)).join('')}</div><button class="secondary wide" data-admin-add="${gi}">+ Ajouter des remarques et photos</button></div>`}</div>`}).join('');
$('#app').innerHTML=`<div class="row spread"><button class="secondary small" id="home">Mes visites</button><span class="pill">${section+1} / ${SC.length}</span><button class="secondary small" id="export">Exporter</button></div><h1 class="visit-heading">Visite RV mag ${E(current.number||'—')}</h1><div class="card"><h2>${section+1}. ${E(SC[section].name)}</h2>${blocks}<div class="bottom"><button class="secondary" id="prev">Précédent</button><button id="next">Suivant</button></div></div>`;
$('#home').onclick=async()=>{await save();screen='list';render()};$('#export').onclick=async()=>{await save();screen='export';render()};
document.querySelectorAll('[data-admin-item]').forEach(t=>t.oninput=()=>{getObs(section,t.dataset.adminItem)[0].note=t.value;schedule()});
// Lier chaque groupe séparément pour conserver les photos dans le bon bloc.
groups.forEach(([title],gi)=>{let root=document.querySelector(`[data-admin-group="${gi}"]`);if(section===2&&title==='Groupe inventaire')return;let obs=adminObs(title);bindObsIn(root,obs);root.querySelector('[data-admin-add]').onclick=()=>{obs.push({id:uid(),note:'',photos:[]});schedule();render()}});
$('#prev').onclick=async()=>{await save();enter(section-1)};$('#next').onclick=async()=>{await save();enter(section+1)};renderMenu();
}
function bindObsIn(root,obs){
root.querySelectorAll('[data-note]').forEach(t=>t.oninput=()=>{obs.find(o=>o.id===t.dataset.note).note=t.value;schedule()});
root.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let i=obs.findIndex(o=>o.id===b.dataset.remove);obs.splice(i,1);schedule();render()});
root.querySelectorAll('[data-photo]').forEach(f=>f.onchange=async()=>{let o=obs.find(o=>o.id===f.dataset.photo);if(!o)return;for(let file of f.files){if(!file.type.startsWith('image/'))continue;try{o.photos.push({data:await shrink(file),name:file.name})}catch(e){notice('Impossible de lire cette photo')}}await save();render()});
root.querySelectorAll('[data-photo-remove]').forEach(b=>b.onclick=()=>{let [id,j]=b.dataset.photoRemove.split(':');obs.find(o=>o.id===id).photos.splice(+j,1);schedule();render()});
root.querySelectorAll('[data-save-photo]').forEach(b=>b.onclick=()=>{let [id,j]=b.dataset.savePhoto.split(':');download(dataToBlob(obs.find(o=>o.id===id).photos[+j].data),`Visite_RV_photo_${Date.now()}.jpg`)});
root.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let [id,j,d]=b.dataset.move.split(':');let p=obs.find(o=>o.id===id).photos;[p[+j],p[+j+(+d)]]=[p[+j+(+d)],p[+j]];schedule();render()})}
function obHTML(o,i){return `<div class="observation" data-oid="${E(o.id)}"><div class="row spread"><b>Remarques</b><button class="danger small" data-remove="${E(o.id)}">Supprimer</button></div><textarea rows="3" data-note="${E(o.id)}" placeholder="Saisir ou dicter une remarque…">${E(o.note)}</textarea><label>Photos</label><div class="photos">${(o.photos||[]).map((p,j)=>`<div class="photo"><img src="${p.data}" alt="Photo"><div class="row"><button class="secondary" data-move="${E(o.id)}:${j}:-1" ${j===0?'disabled':''}>←</button><button class="secondary" data-move="${E(o.id)}:${j}:1" ${j===o.photos.length-1?'disabled':''}>→</button><button class="danger" data-photo-remove="${E(o.id)}:${j}">×</button></div><button class="secondary small" data-save-photo="${E(o.id)}:${j}">Enregistrer dans Photos</button></div>`).join('')}</div><div class="toolbar"><label class="filebutton">📷 Appareil photo<input type="file" accept="image/*" capture="environment" data-photo="${E(o.id)}"></label><label class="filebutton">Photothèque<input type="file" accept="image/*" multiple data-photo="${E(o.id)}"></label></div></div>`}
function renderMenu(){let b=document.createElement('button');b.className='menu-float';b.textContent='☰ Menu';b.onclick=()=>{menuOpen=!menuOpen;renderMenu()};document.body.append(b);if(menuOpen){let panel=document.createElement('div');panel.className='menu-panel';panel.innerHTML='<b>Aller à une rubrique</b>'+SC.map((x,i)=>`<button data-jump="${i}">${i+1}. ${E(x.name)}</button>`).join('');document.body.append(panel);panel.querySelectorAll('[data-jump]').forEach(x=>x.onclick=async()=>{await save();menuOpen=false;enter(+x.dataset.jump)})}}
function bindObs(obs){document.querySelectorAll('[data-note]').forEach(t=>t.oninput=()=>{obs.find(o=>o.id===t.dataset.note).note=t.value;schedule()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let i=obs.findIndex(o=>o.id===b.dataset.remove);obs.splice(i,1);schedule();render()});document.querySelectorAll('[data-photo]').forEach(f=>f.onchange=async()=>{let o=obs.find(o=>o.id===f.dataset.photo);if(!o)return;for(let file of f.files){if(!file.type.startsWith('image/'))continue;try{o.photos.push({data:await shrink(file),name:file.name})}catch(e){notice('Impossible de lire cette photo')}}await save();render();notice('Photo ajoutée au rapport. Pour conserver une prise de vue dans Photos, vérifie son enregistrement dans la photothèque.');});document.querySelectorAll('[data-photo-remove]').forEach(b=>b.onclick=()=>{let [id,j]=b.dataset.photoRemove.split(':');obs.find(o=>o.id===id).photos.splice(+j,1);schedule();render()});document.querySelectorAll('[data-save-photo]').forEach(b=>b.onclick=()=>{let [id,j]=b.dataset.savePhoto.split(':');let p=obs.find(o=>o.id===id).photos[+j];download(dataToBlob(p.data),`Visite_RV_photo_${Date.now()}.jpg`);notice('Photo téléchargée : utilise Partager puis Enregistrer l’image si nécessaire.')});document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let [id,j,d]=b.dataset.move.split(':');let p=obs.find(o=>o.id===id).photos;[p[+j],p[+j+(+d)]]=[p[+j+(+d)],p[+j]];schedule();render()})}
function dataToBlob(data){let [head,body]=data.split(','),type=(head.match(/data:([^;]+)/)||[])[1]||'image/jpeg',raw=atob(body),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new Blob([bytes],{type})}function shrink(file){return new Promise((ok,no)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let scale=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',.76))};img.onerror=()=>{URL.revokeObjectURL(url);no()};img.src=url})}
function exportName(ext){let d=(current.date||'').split('-');return `Visite_RV_Mag_${(current.number||'sans_numero').replace(/[^a-zA-Z0-9_-]/g,'_')}_${d[2]||'00'}_${d[1]||'00'}_${d[0]||'0000'}.${ext}`}
function photoMarkup(photos){let html='';for(let j=0;j<photos.length;j+=3){let part=photos.slice(j,j+3);html+=`<table class="report-pics"><tr>${Array.from({length:3},(_,slot)=>`<td>${part[slot]?`<img src="${part[slot].data}" alt="Photo">`:''}</td>`).join('')}</tr></table>`}return html}
function noteAndPhotos(arr){let out='';for(let o of arr){let photos=o.photos||[],note=(o.note||'').trim();if(!note&&!photos.length)continue;out+='<div class="report-ob">';if(note)out+=`<div class="report-note"><b>Remarques :</b> ${E(note).replace(/\n/g,'<br>')}</div>`;if(photos.length)out+=photoMarkup(photos);out+='</div>'}return out}
function reportBody(){
 let d=(current.date||'').split('-');let date=d.length===3?`${d[2]}/${d[1]}/${d[0]}`:E(current.date||'—');
 let out=`<h1>Visite RV du magasin n° ${E(current.number||'—')} le ${date}</h1><p><b>Nom du magasin :</b> ${E(current.store)}<br><b>Nom du RS :</b> ${E(current.rs)}</p>`;
 SC.forEach((s,i)=>{
  let sectionOut='';
  for(const group of s.groups){
   const title=group[0],items=group[1];let groupOut='';
   if(Array.isArray(items)){
    for(const item of items){
     const arr=current.data[key(i,title+' / '+item)]||[];
     const content=noteAndPhotos(arr);
     if(content)groupOut+=`<h4>${E(item)}</h4>`+content;
    }
    if(!(i===2&&title==='Groupe inventaire'))groupOut+=noteAndPhotos(current.data[key(i,'__admin_group__'+title)]||[]);
   }else{
    groupOut+=noteAndPhotos(current.data[key(i,title)]||[]);
   }
   if(groupOut)sectionOut+=`<h3>${E(title)}</h3>`+groupOut;
  }
  sectionOut+=noteAndPhotos(current.data[key(i,'__general__')]||[]);
  if(sectionOut)out+=`<h2>${i+1}. ${E(s.name)}</h2>`+sectionOut;
 });return out;
}


// Export PDF autonome : pages A4 rendues localement puis intégrées dans un PDF.
async function exportPDF(){
 const btn=$('#pdf');if(btn){btn.disabled=true;btn.textContent='Création du PDF…'}
 try{
  await save();
  const W=1240,H=1754,margin=74,leftMargin=112,usable=W-leftMargin-margin;
  let pages=[],canvas,ctx,y;
  function page(){canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.textBaseline='top';y=margin;pages.push(canvas)}
  function font(size=23,bold=false){ctx.font=`${bold?'bold ':''}${size}px Arial, sans-serif`}
  function line(text,size=23,bold=false,color='#111',indent=0){
   text=String(text||'');font(size,bold);const max=usable-indent;let words=text.split(/\s+/),rows=[],cur='';
   for(let word of words){let test=cur?cur+' '+word:word;if(ctx.measureText(test).width>max&&cur){rows.push(cur);cur=word}else cur=test}
   if(cur)rows.push(cur);if(!rows.length)rows=[''];
   const lh=size*1.27;if(y+rows.length*lh>H-margin)page();
   for(const row of rows){if(y+lh>H-margin)page();font(size,bold);ctx.fillStyle=color;ctx.fillText(row,leftMargin+indent,y);y+=lh}
  }
  function gap(v=8){y+=v;if(y>H-margin)page()}
  async function drawImage(src){return new Promise(resolve=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=src})}
  page();
  const root=document.createElement('div');root.style.cssText='position:fixed;left:-99999px;top:0;width:700px;visibility:hidden';root.innerHTML=reportBody();document.body.appendChild(root);
  async function renderElement(el){
   if(el.matches('h1')){line(el.textContent,28,true,'#2563a6');gap(52)}
   else if(el.matches('h2')){gap(52);line(el.textContent,28,true,'#2563a6');gap(9)}
   else if(el.matches('h3')){gap(10);line(el.textContent,24,true,'#687789',38);gap(5)}
   else if(el.matches('h4')){gap(7);line(el.textContent,23,true,'#515e6d',76);gap(3)}
   else if(el.matches('p,.report-note')){
    const text=el.innerText.replace(/^Remarques\s*:\s*/i,'');
    for(const part of text.split('\n'))line(part,23,false,'#111',el.matches('.report-note')?76:0);
    gap(7);
   }
   else if(el.matches('table')){
    const imgs=[...el.querySelectorAll('img')];const height=235;
    if(y+height>H-margin)page();
    for(let i=0;i<imgs.length;i++){
     let im=await drawImage(imgs[i].src);if(!im)continue;
     let boxW=(usable-76-16)/3,scale=Math.min(boxW/im.width,220/im.height),dw=im.width*scale,dh=im.height*scale;
     ctx.drawImage(im,leftMargin+76+i*(boxW+8)+(boxW-dw)/2,y,dw,dh);
    }
    y+=height;
   }
   else {for(const child of el.children)await renderElement(child)}
  }
  for(const el of root.children)await renderElement(el);
  root.remove();
  // Each page is a JPEG image inside a standards-compliant PDF container.
  const enc=new TextEncoder(),parts=[],offsets=[0];let length=0;
  function add(bytes){parts.push(bytes);length+=bytes.length}
  function str(t){add(enc.encode(t))}
  function obj(id,header,stream){offsets[id]=length;str(`${id} 0 obj\n${header}`);if(stream){str('\nstream\n');add(stream);str('\nendstream')}str('\nendobj\n')}
  str('%PDF-1.4\n');const count=2+pages.length*3;
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  const kids=pages.map((_,i)=>`${3+i*3} 0 R`).join(' ');
  obj(2,`<< /Type /Pages /Kids [${kids}] /Count ${pages.length} >>`);
  for(let i=0;i<pages.length;i++){
   const pid=3+i*3,imgid=pid+1,contentid=pid+2;
   obj(pid,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im${i} ${imgid} 0 R >> >> /Contents ${contentid} 0 R >>`);
   const b64=pages[i].toDataURL('image/jpeg',.86).split(',')[1],binary=atob(b64),bytes=new Uint8Array(binary.length);for(let j=0;j<binary.length;j++)bytes[j]=binary.charCodeAt(j);
   obj(imgid,`<< /Type /XObject /Subtype /Image /Width ${W} /Height ${H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>`,bytes);
   const cmd=enc.encode(`q\n595.28 0 0 841.89 0 0 cm\n/Im${i} Do\nQ\n`);
   obj(contentid,`<< /Length ${cmd.length} >>`,cmd);
  }
  const start=length;str(`xref\n0 ${count+1}\n0000000000 65535 f \n`);for(let i=1;i<=count;i++)str(`${String(offsets[i]).padStart(10,'0')} 00000 n \n`);
  str(`trailer\n<< /Size ${count+1} /Root 1 0 R >>\nstartxref\n${start}\n%%EOF`);
  download(new Blob(parts,{type:'application/pdf'}),exportName('pdf'));notice('PDF créé : retrouve-le dans les téléchargements ou Fichiers.');
 }catch(e){console.error(e);notice('Impossible de créer le PDF : '+(e.message||'erreur'))}
 finally{if(btn){btn.disabled=false;btn.textContent='Télécharger le rapport PDF'}}
}

function buildPrint(){document.title=exportName('pdf').replace(/\.pdf$/,'');$('#printRoot').innerHTML=reportBody()}
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}
function exportWord(){let style=`<style>body{font-family:Arial,sans-serif;color:#111}h1,h2{color:#2563a6}h3{color:#777}h1,h2,h3,p{margin:0;line-height:1.15}h1[style*='font-size:12pt']{font-size:12pt!important;white-space:nowrap}.report-ob{margin:0;page-break-inside:avoid}.report-note{margin:0;line-height:1.15}.report-pics{width:100%;table-layout:fixed;border-spacing:0;margin:0}.report-pics td{width:33.333%;vertical-align:top}.report-pics img{display:block;width:100%;height:175px;object-fit:cover}</style>`;let html=`<html><head><meta charset="utf-8">${style}</head><body>${reportBody()}</body></html>`;download(new Blob(['\ufeff',html],{type:'application/msword'}),exportName('doc'))}
function backup(){download(new Blob([JSON.stringify({version:1,visits},null,0)],{type:'application/json'}),`Visite_RV_sauvegarde_${new Date().toISOString().slice(0,10)}.json`)}async function restore(e){let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.visits))throw Error();if(!confirm(`Importer ${obj.visits.length} visites ? Les visites de même identifiant seront remplacées.`))return;for(let v of obj.visits){if(v.id&&v.data){migrateVisit(v);await put(v)}}visits=await all();for(const v of visits){if(migrateVisit(v))await put(v)}render();notice('Sauvegarde importée')}catch(e){notice('Fichier de sauvegarde invalide')}}
(async()=>{try{db=await openDB();visits=await all();for(const v of visits){if(migrateVisit(v))await put(v)}render()}catch(e){$('#app').innerHTML='<h1>Visite RV</h1><p>Le stockage local est indisponible. Ouvre l’application dans Safari hors navigation privée.</p>'}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
